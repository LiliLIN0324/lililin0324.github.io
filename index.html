<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Lili Lin — portfolio of work in urban planning, design, game development and AI tooling.">
    <title>Lili Lin | Portfolio</title>

    <!-- Google Fonts are unreliable in some regions, so the type stack is
         resolved locally. Inter is used when installed, otherwise the site
         falls back to a Helvetica/Arial grotesque. -->

    <!-- Applied before first paint so switching themes never flashes.
         The full token set lives in index.css. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved !== 'light'
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <style>
      /* Pre-paint background/foreground only — prevents a white flash before
         the bundled stylesheet loads. Keep in sync with :root in index.css. */
      html { background: #fafaf8; color: #111110; }
      html.dark { background: #0a0a0a; color: #f5f5f3; }
      body {
        margin: 0;
        font-family: Inter, "Helvetica Neue", Helvetica, Arial, "Segoe UI",
          Roboto, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "react/": "https://esm.sh/react@^19.2.1/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
</body>
</html>
